name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Unit tests
        run: uv run pytest -q

      # The embedding and reranker models are ~220 MB; cache them between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-bge-small-ms-marco-v1

      # Retrieval regression gate: needs no API key. Fails if Recall@1/3 or MRR
      # drop below eval/baseline.json.
      - name: Retrieval gate
        run: uv run gate

  # Full answer evaluation (grader, generator, verifier, LLM judge). Costs API money,
  # so it only runs when started by hand from the Actions tab, and needs an
  # OPENAI_API_KEY repository secret.
  answer-gate:
    if: github.event_name == 'workflow_dispatch'
    needs: test-and-gate
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-bge-small-ms-marco-v1
      - name: Answer gate
        run: uv run gate --answers
